<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Markdown Conversion</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f9f9fb;
    }
    .instructions {
      background: #fff;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      border-left: 4px solid #007AFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .instructions h2 {
      margin-top: 0;
      color: #333;
    }
    .content-container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .button {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #0070E0, #007AFF);
      color: white;
      text-align: center;
      padding: 16px 20px;
      margin: 30px auto;
      border-radius: 10px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
      transition: all 0.3s ease;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="instructions">
    <h2>📋 Sample Conversion Result</h2>
    <p>This is how your Markdown will look when converted for content platforms. Copy the content below and paste it into your editor.</p>
  </div>
  
  <button onclick="copyContent()" class="button">📋 Copy Sample Content</button>
  
  <div class="content-container">
    @@STYLED_HTML@@
  </div>
  
  <script>
    function copyContent() {
      const section = document.querySelector('section');
      const range = document.createRange();
      range.selectNode(section);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      document.execCommand('copy');
      selection.removeAllRanges();
      alert('Content copied! Paste it into your content editor.');
    }
  </script>
</body>
</html>
